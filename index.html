<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🫜 adorable 蘿蔔庫存表</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義奶茶色與灰藍色微調背景 */
        body {
            background-color: #FBF9F5; /* 溫潤柔和的淺奶茶色背景 */
            color: #4A453F;
        }
        .milk-card {
            background-color: #FFFFFF;
            border-color: #EFECE6;
        }
        .milk-input {
            border-color: #E2DBD0;
            background-color: #FDFCFA;
        }
        .milk-input:focus {
            border-color: #6B7B94;
            ring-color: #6B7B94;
        }
    </style>
</head>
<body class="text-slate-800">

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        <!-- 標題 -->
        <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide" style="color: #6A5E53;">🫜 adorable 蘿蔔庫存表</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('order')" id="btn-order" class="px-4 py-2 text-white rounded-lg text-sm font-medium shadow-sm transition" style="background-color: #5D728A;">訂貨與檔口管理</button>
                <button onclick="switchTab('inventory')" id="btn-inventory" class="px-4 py-2 bg-white text-slate-700 border border-[#E2DBD0] rounded-lg text-sm font-medium hover:bg-[#F4F1EA] transition">庫存管理</button>
                <button onclick="switchTab('shipping')" id="btn-shipping" class="px-4 py-2 bg-white text-slate-700 border border-[#E2DBD0] rounded-lg text-sm font-medium hover:bg-[#F4F1EA] transition">韓國出貨清單</button>
            </div>
        </header>

        <!-- 頁籤 1：訂貨與檔口管理 -->
        <section id="tab-order" class="space-y-6">
            <!-- 新增表單 -->
            <div class="milk-card p-4 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4" style="color: #5A4F46;">➕ 新增訂單 / 商品記錄</h2>
                <form id="orderForm" onsubmit="addOrder(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-9 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
                        <input type="date" id="orderDate" required class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#5D728A]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">檔口名稱</label>
                        <input type="text" id="boothName" placeholder="例如：APM" required class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-xs font-medium text-slate-500 mb-1">商品名稱</label>
                        <input type="text" id="itemName" placeholder="例如：自訂款毛衣" required class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">顏色 (選填)</label>
                        <input type="text" id="itemColor" placeholder="例如：白色" class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">尺寸 (選填)</label>
                        <input type="text" id="itemSize" placeholder="例如：F / S" class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">數量</label>
                        <input type="number" id="itemQty" value="1" min="1" required class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">單價</label>
                        <input type="number" id="itemPrice" value="0" min="0" required class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">訂貨狀況</label>
                        <select id="itemStatus" class="milk-input w-full border rounded-lg px-2.5 py-2 text-sm focus:outline-none">
                            <option value="待訂">待訂</option>
                            <option value="已訂">已訂</option>
                            <option value="工作室">工作室</option>
                            <option value="已回台">已回台</option>
                        </select>
                    </div>
                    <div class="sm:col-span-2 lg:col-span-9 flex justify-end mt-1">
                        <button type="submit" class="text-white font-medium py-2 px-6 rounded-lg text-sm transition shadow-sm" style="background-color: #5D728A;">新增記錄</button>
                    </div>
                </form>
            </div>

            <!-- 列表與篩選 -->
            <div class="milk-card rounded-xl shadow-sm border overflow-hidden">
                <div class="p-4 border-b border-[#EFECE6] flex justify-between items-center flex-wrap gap-4">
                    <div class="flex items-center gap-3">
                        <h2 class="text-lg font-semibold" style="color: #5A4F46;">📋 訂貨與檔口追蹤清單</h2>
                        <button onclick="toggleSort()" id="sortBtn" class="bg-[#F4F1EA] hover:bg-[#EAE4DB] text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg border border-[#E2DBD0] transition">
                            🔄 狀態排序：預設
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="searchOrder" placeholder="搜尋檔口、名稱或顏色..." oninput="renderOrders()" class="milk-input border rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                        <select id="filterStatus" onchange="renderOrders()" class="milk-input border rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                            <option value="">全部狀態</option>
                            <option value="待訂">待訂</option>
                            <option value="已訂">已訂</option>
                            <option value="工作室">工作室</option>
                            <option value="已回台">已回台</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#F9F7F2] text-slate-600 text-xs uppercase tracking-wider">
                                <th class="p-3">日期</th>
                                <th class="p-3">檔口</th>
                                <th class="p-3">商品名稱</th>
                                <th class="p-3">顏色</th>
                                <th class="p-3">尺寸</th>
                                <th class="p-3">數量</th>
                                <th class="p-3">單價</th>
                                <th class="p-3">總花費</th>
                                <th class="p-3">狀況</th>
                                <th class="p-3">備註 (可直接修改)</th>
                                <th class="p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody" class="divide-y divide-[#EFECE6] text-sm">
                            <!-- 動態插入 -->
                        </tbody>
                    </table>
                </div>
                <!-- 總計列 -->
                <div class="p-4 bg-[#FBF9F5] border-t border-[#EFECE6] flex justify-end items-center gap-6 text-sm">
                    <span class="font-medium text-slate-600">目前清單總花費：</span>
                    <span id="totalCostSum" class="text-lg font-bold" style="color: #5D728A;">0</span>
                </div>
            </div>
        </section>

        <!-- 頁籤 2：庫存管理 -->
        <section id="tab-inventory" class="hidden space-y-6">
            <div class="milk-card p-4 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4" style="color: #5A4F46;">📦 新增庫存商品</h2>
                <form id="inventoryForm" onsubmit="addInventory(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">商品名稱/型號</label>
                        <input type="text" id="invName" placeholder="例如：喇叭褲 黑S" required class="milk-input w-full border rounded-lg px-3 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">現有庫存數量</label>
                        <input type="number" id="invQty" value="0" min="0" required class="milk-input w-full border rounded-lg px-3 py-2 text-sm focus:outline-none">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm" style="background-color: #5D728A;">新增庫存</button>
                    </div>
                </form>
            </div>

            <div class="milk-card rounded-xl shadow-sm border overflow-hidden">
                <div class="p-4 border-b border-[#EFECE6]">
                    <h2 class="text-lg font-semibold" style="color: #5A4F46;">📊 現有庫存清單</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#F9F7F2] text-slate-600 text-xs uppercase tracking-wider">
                                <th class="p-3">商品名稱</th>
                                <th class="p-3">庫存數量</th>
                                <th class="p-3 text-right">快速調整</th>
                                <th class="p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody" class="divide-y divide-[#EFECE6] text-sm">
                            <!-- 動態插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 頁籤 3：韓國出貨清單 -->
        <section id="tab-shipping" class="hidden space-y-6">
            <div class="milk-card p-4 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold" style="color: #5A4F46;">✈️ 韓國出貨包裹分流清單</h2>
                    <button onclick="generateShippingList()" class="text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm" style="background-color: #5D728A;">一鍵同步「已回台/工作室」商品</button>
                </div>
                <p class="text-sm text-slate-500 mb-4">此處專門用來整理從韓國工作室出貨、打包或準備寄出的品項。</p>
            </div>

            <div class="milk-card rounded-xl shadow-sm border overflow-hidden">
                <div class="p-4 border-b border-[#EFECE6] flex justify-between items-center">
                    <h2 class="text-lg font-semibold" style="color: #5A4F46;">📦 待寄出 / 已打包清單</h2>
                    <span id="shippingCount" class="text-xs bg-[#EAF0F6] text-[#5D728A] px-2.5 py-1 rounded-full font-medium">共 0 項</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#F9F7F2] text-slate-600 text-xs uppercase tracking-wider">
                                <th class="p-3">日期</th>
                                <th class="p-3">檔口</th>
                                <th class="p-3">商品名稱</th>
                                <th class="p-3">顏色</th>
                                <th class="p-3">尺寸</th>
                                <th class="p-3">數量</th>
                                <th class="p-3">總花費</th>
                                <th class="p-3">目前狀態</th>
                                <th class="p-3">備註</th>
                                <th class="p-3 text-right">狀態切換</th>
                            </tr>
                        </thead>
                        <tbody id="shippingTableBody" class="divide-y divide-[#EFECE6] text-sm">
                            <!-- 動態插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let orders = JSON.parse(localStorage.getItem('shop_orders')) || [];
        let inventory = JSON.parse(localStorage.getItem('shop_inventory')) || [];
        let isSortedByStatus = false;

        document.getElementById('orderDate').valueAsDate = new Date();

        function switchTab(tabName) {
            document.getElementById('tab-order').classList.add('hidden');
            document.getElementById('tab-inventory').classList.add('hidden');
            document.getElementById('tab-shipping').classList.add('hidden');

            document.getElementById('btn-order').className = 'px-4 py-2 bg-white text-slate-700 border border-[#E2DBD0] rounded-lg text-sm font-medium hover:bg-[#F4F1EA] transition';
            document.getElementById('btn-inventory').className = 'px-4 py-2 bg-white text-slate-700 border border-[#E2DBD0] rounded-lg text-sm font-medium hover:bg-[#F4F1EA] transition';
            document.getElementById('btn-shipping').className = 'px-4 py-2 bg-white text-slate-700 border border-[#E2DBD0] rounded-lg text-sm font-medium hover:bg-[#F4F1EA] transition';

            if (tabName === 'order') {
                document.getElementById('tab-order').classList.remove('hidden');
                document.getElementById('btn-order').className = 'px-4 py-2 text-white rounded-lg text-sm font-medium shadow-sm transition';
                document.getElementById('btn-order').style.backgroundColor = '#5D728A';
                renderOrders();
            } else if (tabName === 'inventory') {
                document.getElementById('tab-inventory').classList.remove('hidden');
                document.getElementById('btn-inventory').className = 'px-4 py-2 text-white rounded-lg text-sm font-medium shadow-sm transition';
                document.getElementById('btn-inventory').style.backgroundColor = '#5D728A';
                renderInventory();
            } else if (tabName === 'shipping') {
                document.getElementById('tab-shipping').classList.remove('hidden');
                document.getElementById('btn-shipping').className = 'px-4 py-2 text-white rounded-lg text-sm font-medium shadow-sm transition';
                document.getElementById('btn-shipping').style.backgroundColor = '#5D728A';
                renderShipping();
            }
        }

        // 排序按鈕切換邏輯
        function toggleSort() {
            isSortedByStatus = !isSortedByStatus;
            const btn = document.getElementById('sortBtn');
            if (isSortedByStatus) {
                btn.className = 'bg-[#EAF0F6] text-[#5D728A] text-xs font-medium px-3 py-1.5 rounded-lg border border-[#C6D2E1] transition';
                btn.innerText = '🔄 狀態排序：已啟動 (待訂➔已訂➔工作室➔已回台)';
            } else {
                btn.className = 'bg-[#F4F1EA] hover:bg-[#EAE4DB] text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg border border-[#E2DBD0] transition';
                btn.innerText = '🔄 狀態排序：預設';
            }
            renderOrders();
        }

        // --- 訂單相關功能 ---
        function addOrder(e) {
            e.preventDefault();
            const newOrder = {
                id: Date.now(),
                date: document.getElementById('orderDate').value,
                booth: document.getElementById('boothName').value,
                item: document.getElementById('itemName').value,
                color: document.getElementById('itemColor').value.trim() || '-',
                size: document.getElementById('itemSize').value.trim() || '-',
                qty: parseInt(document.getElementById('itemQty').value),
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                status: document.getElementById('itemStatus').value,
                note: ''
            };
            orders.unshift(newOrder);
            saveAndRender();
            document.getElementById('orderForm').reset();
            document.getElementById('orderDate').valueAsDate = new Date();
        }

        function deleteOrder(id) {
            orders = orders.filter(o => o.id !== id);
            saveAndRender();
        }

        function updateOrderStatus(id, newStatus) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.status = newStatus;
                saveAndRender();
            }
        }

        function updateOrderNote(id, newNote) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.note = newNote;
                localStorage.setItem('shop_orders', JSON.stringify(orders));
            }
        }

        function saveAndRender() {
            localStorage.setItem('shop_orders', JSON.stringify(orders));
            renderOrders();
        }

        function renderOrders() {
            const tbody = document.getElementById('orderTableBody');
            const search = document.getElementById('searchOrder').value.toLowerCase();
            const filter = document.getElementById('filterStatus').value;

            tbody.innerHTML = '';
            let filtered = orders.filter(o => {
                const matchSearch = o.booth.toLowerCase().includes(search) || 
                                    o.item.toLowerCase().includes(search) || 
                                    o.color.toLowerCase().includes(search) || 
                                    o.size.toLowerCase().includes(search) || 
                                    (o.note && o.note.toLowerCase().includes(search));
                const matchFilter = filter === '' || o.status === filter;
                return matchSearch && matchFilter;
            });

            // 依訂貨狀況排序：待訂 > 已訂 > 工作室 > 已回台
            if (isSortedByStatus) {
                const statusOrder = { '待訂': 1, '已訂': 2, '工作室': 3, '已回台': 4 };
                filtered.sort((a, b) => (statusOrder[a.status] || 99) - (statusOrder[b.status] || 99));
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-4 text-center text-slate-400">目前沒有相關訂貨記錄</td></tr>`;
                document.getElementById('totalCostSum').innerText = '0';
                return;
            }

            let totalSum = 0;
            filtered.forEach(o => {
                const totalCost = o.qty * o.price;
                totalSum += totalCost;

                let badgeColor = 'bg-slate-100 text-slate-800';
                if (o.status === '待訂') badgeColor = 'bg-[#FAF3E9] text-[#A67C52]';
                if (o.status === '已訂') badgeColor = 'bg-[#EAF0F6] text-[#5D728A]';
                if (o.status === '工作室') badgeColor = 'bg-[#F2ECF5] text-[#7A5885]';
                if (o.status === '已回台') badgeColor = 'bg-[#EAF5EF] text-[#4A7C59]';

                tbody.innerHTML += `
                    <tr class="hover:bg-[#F9F7F2] transition">
                        <td class="p-3 text-slate-600 text-xs">${o.date}</td>
                        <td class="p-3 font-medium text-slate-900">${o.booth}</td>
                        <td class="p-3 text-slate-800 font-medium">${o.item}</td>
                        <td class="p-3 text-slate-600">${o.color}</td>
                        <td class="p-3 text-slate-600">${o.size}</td>
                        <td class="p-3 text-slate-600">${o.qty}</td>
                        <td class="p-3 text-slate-600">${o.price.toLocaleString()}</td>
                        <td class="p-3 font-semibold" style="color: #5D728A;">${totalCost.toLocaleString()}</td>
                        <td class="p-3">
                            <select onchange="updateOrderStatus(${o.id}, this.value)" class="text-xs font-semibold px-2.5 py-1 rounded-full ${badgeColor} border-0 cursor-pointer focus:outline-none">
                                <option value="待訂" ${o.status === '待訂' ? 'selected' : ''}>待訂</option>
                                <option value="已訂" ${o.status === '已訂' ? 'selected' : ''}>已訂</option>
                                <option value="工作室" ${o.status === '工作室' ? 'selected' : ''}>工作室</option>
                                <option value="已回台" ${o.status === '已回台' ? 'selected' : ''}>已回台</option>
                            </select>
                        </td>
                        <td class="p-3">
                            <input type="text" value="${o.note || ''}" placeholder="點此輸入備註..." oninput="updateOrderNote(${o.id}, this.value)" class="milk-input w-full border rounded px-2 py-1 text-xs text-slate-700 focus:outline-none">
                        </td>
                        <td class="p-3 text-right">
                            <button onclick="deleteOrder(${o.id})" class="text-red-400 hover:text-red-600 text-xs font-medium">刪除</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('totalCostSum').innerText = totalSum.toLocaleString();
        }

        // --- 庫存相關功能 ---
        function addInventory(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('invName').value,
                qty: parseInt(document.getElementById('invQty').value)
            };
            inventory.unshift(newItem);
            saveAndRenderInventory();
            document.getElementById('inventoryForm').reset();
        }

        function adjustQty(id, amount) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(0, item.qty + amount);
                saveAndRenderInventory();
            }
        }

        function deleteInventory(id) {
            inventory = inventory.filter(i => i.id !== id);
            saveAndRenderInventory();
        }

        function saveAndRenderInventory() {
            localStorage.setItem('shop_inventory', JSON.stringify(inventory));
            renderInventory();
        }

        function renderInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';

            if (inventory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">目前沒有庫存記錄</td></tr>`;
                return;
            }

            inventory.forEach(i => {
                tbody.innerHTML += `
                    <tr class="hover:bg-[#F9F7F2] transition">
                        <td class="p-3 font-medium text-slate-900">${i.name}</td>
                        <td class="p-3 text-slate-800 font-bold">${i.qty}</td>
                        <td class="p-3 text-right space-x-1">
                            <button onclick="adjustQty(${i.id}, -1)" class="bg-[#EFECE6] hover:bg-[#E2DBD0] px-2 py-1 rounded text-xs font-bold">-1</button>
                            <button onclick="adjustQty(${i.id}, 1)" class="bg-[#EFECE6] hover:bg-[#E2DBD0] px-2 py-1 rounded text-xs font-bold">+1</button>
                        </td>
                        <td class="p-3 text-right">
                            <button onclick="deleteInventory(${i.id})" class="text-red-400 hover:text-red-600 text-xs font-medium">刪除</button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- 韓國出貨清單功能 ---
        function renderShipping() {
            const tbody = document.getElementById('shippingTableBody');
            const shippingItems = orders.filter(o => o.status === '工作室' || o.status === '已回台');
            
            document.getElementById('shippingCount').innerText = `共 ${shippingItems.length} 項`;
            tbody.innerHTML = '';

            if (shippingItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-slate-400">目前沒有處於「工作室」或「已回台」的待寄出商品</td></tr>`;
                return;
            }

            shippingItems.forEach(o => {
                const totalCost = o.qty * o.price;
                let badgeColor = o.status === '工作室' ? 'bg-[#F2ECF5] text-[#7A5885]' : 'bg-[#EAF5EF] text-[#4A7C59]';
                tbody.innerHTML += `
                    <tr class="hover:bg-[#F9F7F2] transition">
                        <td class="p-3 text-slate-600 text-xs">${o.date}</td>
                        <td class="p-3 font-medium text-slate-900">${o.booth}</td>
                        <td class="p-3 text-slate-800 font-medium">${o.item}</td>
                        <td class="p-3 text-slate-600">${o.color}</td>
                        <td class="p-3 text-slate-600">${o.size}</td>
                        <td class="p-3 text-slate-600">${o.qty}</td>
                        <td class="p-3 font-semibold" style="color: #5D728A;">${totalCost.toLocaleString()}</td>
                        <td class="p-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${badgeColor}">${o.status}</span>
                        </td>
                        <td class="p-3 text-slate-600 text-xs">${o.note || '-'}</td>
                        <td class="p-3 text-right">
                            <select onchange="updateOrderStatus(${o.id}, this.value); renderShipping();" class="text-xs border border-[#E2DBD0] rounded px-2 py-1 focus:outline-none">
                                <option value="工作室" ${o.status === '工作室' ? 'selected' : ''}>設為 工作室</option>
                                <option value="已回台" ${o.status === '已回台' ? 'selected' : ''}>設為 已回台</option>
                                <option value="已訂" ${o.status === '已訂' ? 'selected' : ''}>移回 已訂</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        function generateShippingList() {
            alert('系統已自動過濾並整理所有在「工作室」與「已回台」的商品供您寄出核對！');
            switchTab('shipping');
        }

        renderOrders();
    </script>
</body>
</html>
